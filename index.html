    try{
      var t=today();

      if(!head.exists()){
        var list=entries.map(function(e){return Object.assign({},e)});var n=Math.ceil(list.length/300);
        for(var i=0;i<n;i++){
          var o={date:t,part:i,parts:n,count:list.length,createdAt:Date.now(),entries:list.slice(i*300,i*300+300)};
          if(i===0)o.settings={groups:S.groups,methods:S.methods,vendors:S.vendors};
          await setDoc(doc(fs,'backups',t+'_'+i),o);

        var all=await getDocs(backupsCol),ds={};
        all.docs.forEach(function(x){var dt=(x.data()||{}).date;if(dt)ds[dt]=1});
        var keep=Object.keys(ds).sort().reverse().slice(0,5);
        all.docs.forEach(function(x){var dt=(x.data()||{}).date;if(dt&&keep.indexOf(dt)<0)deleteDoc(x.ref)});
      }
      try{localStorage.setItem('lastAuto',t)}catch(e){}
    }catch(e){console.error('자동 백업 실패',e)}

    if(!confirm('백업 파일의 내역 '+d.entries.length+'건을 불러옵니다.\n같은 내역은 백업 내용으로 덮어쓰고, 백업에 없는 내역은 그대로 둡니다. 진행할까요?'))return;
    try{
      if(d.settings){S.groups=d.settings.groups||S.groups;S.methods=d.settings.methods||S.methods;S.vendors=d.settings.vendors||S.vendors;rebuildMaps();await setDoc(settingsRef,{groups:S.groups,methods:S.methods,vendors:S.vendors,people:S.people})}
      for(var i=0;i<d.entries.length;i+=20){await Promise.all(d.entries.slice(i,i+20).map(function(e){var id=e.id;var x=Object.assign({},e);delete x.id;return setDoc(doc(fs,'entries',id),x)}))}
      toast('복원했습니다 ('+d.entries.length+'건)');
    }catch(e){toast('복원하지 못했습니다')}
  }
  function exportCsv(){
    var all=entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:((a.createdAt||0)-(b.createdAt||0))}),run=0,q=function(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'};
    var lines=[['번호','날짜','내용','수입','지출','합계','결제수단','구매처','메모','분류','대분류','지출자','구분','청구'].join(',')];
    all.forEach(function(e,i){if(!e.settle)run+=signed(e);var t=typeOf(e);lines.push([i+1,e.date,q(e.content),t==='수입'?e.amount:'',t==='수입'?'':e.amount,e.settle?'':run,e.method,q(e.vendor),q(e.memo),e.cat,SUB2G[e.cat]||'',e.who,t,(e.settle?(e.proxy?'대신결제':'청구'):'')].join(','))});
    var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='가계부_'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();toast('저장했습니다');
  }

  /* ---------- 탭/이벤트 ---------- */
  var TITLES={enter:'입력',list:'내역',stat:'통계',set:'설정'};
  function goTab(t){
    tab=t;Object.keys(TITLES).forEach(function(k){$('t-'+k).hidden=k!==t});
    $('kpw').hidden=t!=='enter';$('ttl').textContent=TITLES[t];
    document.querySelectorAll('.nav button').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===t)});
    applyTheme();rerender();document.querySelector('main').scrollTop=0;
  }
  function rerender(){if(tab==='list')renderList();else if(tab==='stat')renderStat();else if(tab==='set')renderSet();else drawEnter()}
  document.querySelector('.nav').addEventListener('click',function(ev){var b=ev.target.closest('[data-tab]');if(!b)return;var t=b.getAttribute('data-tab');if(t==='list'&&tab!=='list'){F={};lrange=null}goTab(t)});

  document.addEventListener('click',async function(ev){
    var el=ev.target,b;
    if(el.id==='sheet-ov'){chain=false;closeSheet();return}
    if(!el.closest('[data-del]')&&delArm){delArm=null;if(tab==='list')renderList()}
    if(el.closest('[data-close]')){var bk=$('sheet').dataset.back;if(bk==='cat')openCat();else{chain=false;closeSheet()}return}
    if(b=el.closest('[data-k]')){press(b.getAttribute('data-k'));return}
    if(b=el.closest('[data-ft]')){var nt=b.getAttribute('data-ft');if(nt!==f.type){f.type=nt;if(f.cat&&SUB2T[f.cat]!==nt)f.cat=null}drawEnter();return}
    if(b=el.closest('[data-pick]')){var k=b.getAttribute('data-pick');document.activeElement&&document.activeElement.blur();if(k==='cat')openCat();else openList(k);return}
    if(el.closest('#r-settle')){f.settle=!f.settle;if(!f.settle)f.proxy=false;drawEnter();return}
    if(b=el.closest('[data-kind]')){f.proxy=b.getAttribute('data-kind')==='proxy';drawEnter();return}
    if(b=el.closest('[data-cg]')){openCat(b.getAttribute('data-cg'));return}
    if(b=el.closest('[data-g]')){var g=b.getAttribute('data-g'),gx=S.groups.find(function(x){return x.g===g});if(gx.items.length===1){f.cat=gx.items[0];closeSheet();drawEnter();if(chain)nextStep('cat')}else openSub(g);return}
    if(b=el.closest('[data-sub]')){f.cat=b.getAttribute('data-sub');closeSheet();drawEnter();if(chain)nextStep('cat');return}
    if(b=el.closest('[data-set]')){var kind=b.getAttribute('data-set');f[kind]=b.getAttribute('data-val');if(kind==='method'&&(f.method==='교회청구'||f.method==='법인카드'))f.settle=true;closeSheet();drawEnter();if(chain)nextStep(kind);return}
    if(el.closest('[data-vok]')){var vn=$('vq').value.trim();if(!vn)return;if(S.vendors.indexOf(vn)<0){S.vendors.push(vn);saveSettings()}f.vendor=vn;closeSheet();drawEnter();if(chain)nextStep('vendor');return}
    if(el.closest('[data-newv]')){var nv=$('nv').value.trim();if(!nv)return;if(S.vendors.indexOf(nv)<0){S.vendors.push(nv);saveSettings()}f.vendor=nv;closeSheet();drawEnter();if(chain)nextStep('vendor');return}
    if(b=el.closest('[data-mv]')){var n=Number(b.getAttribute('data-mv'));if(lrange){month=ym(lrange.from);lrange=null}month=shiftM(month,n);renderList();return}
    if(b=el.closest('[data-sv]')){var n2=Number(b.getAttribute('data-sv'));st.anchor=st.mode==='월간'?shiftM(ym(st.anchor),n2)+'-01':addDays(st.anchor,7*n2);st.exp=null;renderStat();return}
    if(b=el.closest('[data-sm]')){st.mode=b.getAttribute('data-sm');st.anchor=today();st.exp=null;renderStat();return}
    if(b=el.closest('[data-got]')){var ge=entries.find(function(x){return x.id===b.getAttribute('data-got')});if(ge){try{await setDoc(doc(fs,'entries',ge.id),{got:!ge.got},{merge:true})}catch(x){toast('저장하지 못했습니다')}}return}
    if(b=el.closest('[data-st]')){st.type=b.getAttribute('data-st');st.exp=null;renderStat();return}
    if(b=el.closest('[data-sb]')){st.by=b.getAttribute('data-sb');st.exp=null;renderStat();return}
    if(b=el.closest('[data-eg]')){var g2=b.getAttribute('data-eg');st.exp=st.exp===g2?null:g2;renderStat();if(st.exp)reveal('.subs');return}
    var jump=function(filter){F=filter;lrange=statRange();goTab('list')};
    if(b=el.closest('[data-fg]')){jump({group:b.getAttribute('data-fg')});return}
    if(b=el.closest('[data-fc]')){jump({cat:b.getAttribute('data-fc')});return}
    if(b=el.closest('[data-fw]')){jump({who:b.getAttribute('data-fw')});return}
    if(b=el.closest('[data-fm]')){jump({method:b.getAttribute('data-fm')});return}
    if(b=el.closest('[data-fv]')){jump({vendor:b.getAttribute('data-fv')});return}
    if(b=el.closest('[data-open]')){var id=b.getAttribute('data-open');openId=openId===id?null:id;delArm=null;renderList();if(openId)reveal('.acts');return}
    if(b=el.closest('[data-edit]')){var e=entries.find(function(x){return x.id===b.getAttribute('data-edit')});if(!e)return;
      f={type:typeOf(e),amount:String(e.amount),cat:e.cat,method:e.method,vendor:e.vendor||'',who:e.who,settle:!!e.settle,proxy:!!e.proxy,got:!!e.got,date:e.date,editingId:e.id};
      $('f-content').value=e.content;$('f-memo').value=e.memo||'';openId=null;goTab('enter');return}
    if(b=el.closest('[data-del]')){var id2=b.getAttribute('data-del');if(delArm!==id2){delArm=id2;renderList();reveal('.acts');return}delArm=null;openId=null;try{await deleteDoc(doc(fs,'entries',id2));toast('삭제했습니다')}catch(x){toast('삭제하지 못했습니다')}return}
    if(b=el.closest('[data-cpm]')){cpM=shiftM(cpM,Number(b.getAttribute('data-cpm')));drawCp();return}
    if(b=el.closest('[data-cpd]')){f.date=b.getAttribute('data-cpd');closeSheet();drawEnter();return}
    if(b=el.closest('[data-lf]')){var lv0=b.getAttribute('data-lf');lf=lf===lv0?'전체':lv0;renderList();return}
    if(b=el.closest('[data-lv]')){lv=b.getAttribute('data-lv');renderList();return}
    if(b=el.closest('[data-cd]')){calSel=b.getAttribute('data-cd');openId=null;renderList();return}
    if(el.closest('[data-clear]')){F={};lrange=null;renderList();return}
    if(el.closest('#me')){goTab('set');return}
    if(b=el.closest('[data-me]')){me=b.getAttribute('data-me');S.people[uid]=me;$('me').textContent=me;await saveSettings();renderSet();return}
    if(b=el.closest('[data-mg]')){var p=b.getAttribute('data-mg').split(':'),i=Number(p[0]),j=i+Number(p[1]);if(j>=0&&j<S.groups.length){var t=S.groups[i];S.groups[i]=S.groups[j];S.groups[j]=t;await saveSettings();renderSet()}return}
    if(b=el.closest('[data-ms]')){var q2=b.getAttribute('data-ms').split(':'),gx=S.groups[Number(q2[0])],a1=Number(q2[1]),b1=a1+Number(q2[2]);if(b1>=0&&b1<gx.items.length){var t2=gx.items[a1];gx.items[a1]=gx.items[b1];gx.items[b1]=t2;await saveSettings();renderSet()}return}
    if(b=el.closest('[data-mm]')){var mp=b.getAttribute('data-mm').split(':'),m1=Number(mp[0]),m2=m1+Number(mp[1]);if(m2>=0&&m2<S.methods.length){var mt=S.methods[m1];S.methods[m1]=S.methods[m2];S.methods[m2]=mt;await saveSettings();renderSet()}return}
    if(b=el.closest('[data-ged]')){openGroupEdit(Number(b.getAttribute('data-ged')));return}
    if(b=el.closest('[data-gty]')){geT=b.getAttribute('data-gty');document.querySelectorAll('[data-gty]').forEach(function(x){x.classList.toggle('on',x===b)});return}
    if(b=el.closest('[data-gico]')){geI=Number(b.getAttribute('data-gico'));document.querySelectorAll('[data-gico]').forEach(function(x){x.classList.toggle('on',x===b)});return}
    if(b=el.closest('[data-gdel]')){var gd=S.groups[geG];if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='정말 삭제 (소분류 '+gd.items.length+'개 함께 삭제) · 한 번 더';return}S.groups.splice(geG,1);if(setOpen===gd.g)setOpen=null;rebuildMaps();await saveSettings();closeSheet();renderSet();return}
    if(el.closest('[data-gsv]')){var nn=$('ge-n').value.trim(),gx2=S.groups[geG];if(!nn)return;if(nn!==gx2.g&&S.groups.some(function(y){return y.g===nn})){toast('이미 있는 대분류입니다');return}if(setOpen===gx2.g)setOpen=nn;gx2.g=nn;gx2.t=geT;if(geI!=null)gx2.icon=geI;rebuildMaps();await saveSettings();closeSheet();renderSet();return}
    if(b=el.closest('[data-sg]')){var gn=S.groups[Number(b.getAttribute('data-sg'))].g;setOpen=setOpen===gn?null:gn;renderSet();if(setOpen)reveal('.sb .ad0');return}
    if(b=el.closest('[data-ri]')){S.groups[Number(b.getAttribute('data-gi'))].items.splice(Number(b.getAttribute('data-ri')),1);rebuildMaps();await saveSettings();renderSet();return}
    if(b=el.closest('[data-rg]')){S.groups.splice(Number(b.getAttribute('data-rg')),1);rebuildMaps();await saveSettings();renderSet();return}
    if(b=el.closest('[data-ai]')){var gi=Number(b.getAttribute('data-ai')),v=$('ai'+gi).value.trim();if(!v)return;if(SUB2G[v]){toast('이미 있는 이름입니다');return}S.groups[gi].items.push(v);rebuildMaps();await saveSettings();renderSet();return}
    if(el.closest('[data-ag]')){var ng=$('ng').value.trim();if(!ng)return;if(S.groups.some(function(x){return x.g===ng})){toast('이미 있는 대분류입니다');return}S.groups.push({g:ng,t:$('ngt').value,items:[]});await saveSettings();renderSet();return}
    if(b=el.closest('[data-rm]')){S.methods.splice(Number(b.getAttribute('data-rm')),1);await saveSettings();renderSet();return}
    if(el.closest('[data-am]')){var m=$('am').value.trim();if(!m||S.methods.indexOf(m)>=0)return;S.methods.push(m);await saveSettings();renderSet();return}
    if(b=el.closest('[data-rv]')){S.vendors.splice(Number(b.getAttribute('data-rv')),1);await saveSettings();renderSet();return}
    if(el.closest('[data-av]')){var vv=$('av').value.trim();if(!vv||S.vendors.indexOf(vv)>=0)return;S.vendors.push(vv);await saveSettings();renderSet();return}
    if(el.closest('#btn-snap')){openSnaps();return}
    if(b=el.closest('[data-snap]')){var sd=b.getAttribute('data-snap');closeSheet();restoreSnap(sd);return}
    if(el.closest('#btn-bk')){exportBackup();return}
    if(el.closest('#btn-rs')){$('bk-file').click();return}
    if(el.closest('#btn-csv')){exportCsv();return}
    if(el.closest('#btn-out')){signOut(auth);return}
  });

  document.addEventListener('change',async function(ev){if(ev.target.id==='bk-file'&&ev.target.files[0]){var fl=ev.target.files[0];ev.target.value='';await restoreBackup(fl)}});

  /* ---------- 로그인·실시간 ---------- */
  function afterIdentity(){
    me=S.people[uid]||'';
    $('who-modal').hidden=!!me;
    $('me').textContent=me||email;
    if(me&&!f.who)f.who=me;
    if(!me)$('who-pick').innerHTML=NAMES.map(function(n){return '<button class="chipb" data-pickme="'+n+'">'+n+'</button>'}).join('');
  }
  $('who-pick').addEventListener('click',async function(ev){var b=ev.target.closest('[data-pickme]');if(!b)return;me=b.getAttribute('data-pickme');S.people[uid]=me;$('who-modal').hidden=true;$('me').textContent=me;f.who=me;await saveSettings();rerender()});
  $('btn-login').addEventListener('click',async function(){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){var c=(e&&e.code)||'';$('login-msg').textContent=c==='auth/unauthorized-domain'?'이 주소가 Firebase 승인된 도메인에 없습니다. (auth/unauthorized-domain)':c==='auth/popup-blocked'?'팝업이 차단됐습니다. 주소창 오른쪽의 팝업 차단 표시를 허용하세요.':c==='auth/operation-not-allowed'?'Firebase에서 Google 로그인이 켜져 있지 않습니다. (auth/operation-not-allowed)':c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'?'로그인 창이 닫혔습니다. 다시 눌러 주세요.':'로그인하지 못했습니다. ('+(c||e)+')';console.error(e)}});
  onAuthStateChanged(auth,function(u){
    unsubs.forEach(function(x){x()});unsubs=[];
    entries=[];loaded=false;sReady=false;fresh=false;didBackup=false;
    if(!u){$('app').hidden=true;$('login').hidden=false;$('who-modal').hidden=true;return}
    uid=u.uid;email=u.email||'';
    $('login').hidden=true;$('app').hidden=false;
    resetForm();goTab('enter');
    var timer=setTimeout(function(){banner('저장된 내역을 아직 불러오지 못했습니다. 연결을 확인하세요.')},10000);
    var onErr=function(err){clearTimeout(timer);loaded=true;banner(err&&err.code==='permission-denied'?'이 계정은 접근이 허용되지 않았습니다. 다른 계정으로 로그인하세요.':'내역을 불러오지 못했습니다.');rerender()};
    unsubs.push(onSnapshot(settingsRef,function(snap){
      var d=snap.exists()?snap.data():null;
      if(d){S.groups=d.groups||DEF_GROUPS;S.methods=d.methods||DEF_METHODS;S.vendors=d.vendors||DEF_VENDORS;S.people=d.people||{};if(migrate()){try{setDoc(settingsRef,{groups:S.groups,methods:S.methods,vendors:S.vendors,people:S.people})}catch(e){}}}
      rebuildMaps();afterIdentity();sReady=true;maybeBackup();
      var ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'))rerender();
    },onErr));
    unsubs.push(onSnapshot(entriesCol,function(snap){
      if(!snap.metadata.fromCache){clearTimeout(timer);banner('')}
      entries=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
      loaded=true;
      fresh=!snap.metadata.fromCache;maybeBackup();
      var ae=document.activeElement;if(ae&&ae.tagName==='INPUT')return;
      rerender();
    },onErr));
  });
})();
